spring:
  application:
    name: bank-service
  profiles:
    default: h2          # `./mvnw spring-boot:run` works with no external services
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema is owned by Flyway, Hibernate only checks it
  flyway:
    enabled: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
